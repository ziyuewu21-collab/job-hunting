<style>
/* Layout: desktop = left sidebar + content; phone = sticky scrollable tab strip on top + content. Seven views in pipeline order. */
:root{
  --paper:#f3eee2; --surface:#fbf8f1; --ink:#1f2a24; --muted:#6c6b5f; --line:#dcd4c2;
  --pine:#1f4d3a; --pine-ink:#f6f2e8; --pine-soft:#dde7df; --ochre:#a96a1c; --rust:#a3402e; --ok:#2f6f4c;
  --serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161a17; --surface:#1e231f; --ink:#e7e2d4; --muted:#9c9a8b; --line:#323a33;
  --pine:#86bf9f; --pine-ink:#10160f; --pine-soft:#26352c; --ochre:#e0a14f; --rust:#e48270; --ok:#79c79a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand .mk{width:36px;height:36px;border-radius:50%;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center;font:900 17px var(--serif)}
.brand b{font:900 17px var(--serif);display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:11px}
nav.views{display:flex;flex-direction:column;gap:2px}
nav.views button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;color:var(--muted)}
nav.views button i{font:12px var(--mono);font-style:normal;opacity:.7}
nav.views button[aria-current="page"]{background:var(--pine-soft);color:var(--ink);font-weight:600}
nav.views button:focus-visible{outline:2px solid var(--pine)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.sync-pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 9px;font-size:11px;white-space:nowrap}
.sync-pill[data-state="ok"]{border-color:var(--ok);color:var(--ok)}
.sync-pill[data-state="busy"]{border-color:var(--ochre);color:var(--ochre)}
.sync-pill[data-state="error"]{border-color:var(--rust);color:var(--rust)}
.cloud-gate{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.cloud-gate[hidden]{display:none}

main{padding:32px clamp(16px,4vw,48px) 80px;min-width:0;max-width:1100px}

h2{font:600 18px/1.3 var(--serif);margin:0}

.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}

.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;min-height:110px;line-height:1.55}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
.chip.hit{border-color:var(--pine);background:var(--pine-soft);color:var(--ink);font-weight:600}
.chip.miss{border-style:dashed;color:var(--muted)}
.chip button{all:unset;cursor:pointer;color:var(--muted)}

.score.low{color:var(--ochre)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pine)}

.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}

.stat span{font-size:12px;color:var(--muted)}

.jc .mv{display:flex;gap:6px}

.tag.t{border-color:var(--ok);color:var(--ok)} .tag.a{border-color:var(--pine);color:var(--pine)} .tag.o{border-color:var(--ochre);color:var(--ochre)}
.due{font:12px var(--mono)} .due.hot{color:var(--rust)} .due.soon{color:var(--ochre)}
.para{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.para .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.para .meta b{color:var(--pine)}
.para textarea{min-height:70px}
.sug{border-left:3px solid var(--ochre);padding:6px 10px;font-size:13px;background:var(--surface);border-radius:0 8px 8px 0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.seg{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;width:fit-content;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:7px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.q{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.drill{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.drill .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bigq{font:900 22px/1.4 var(--serif);margin:0;text-wrap:balance}
.timer{font:600 30px var(--mono);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:18px;width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--paper);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:8px}
  .side .foot,.brand small{display:none}
  .side{gap:7px}
  .brand{justify-content:space-between}
  .brand .mk{width:28px;height:28px;font-size:14px}
  nav.views{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  nav.views::-webkit-scrollbar{display:none}
  nav.views button{white-space:nowrap;padding:6px 10px}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:25px}
  .stat{grid-template-columns:repeat(3,minmax(0,1fr))}
  .board{grid-auto-columns:82%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mk">龙</div><div><b>求职一条龙</b><small>个人求职工作台</small></div><button class="sync-pill" id="syncStatus" type="button" data-state="busy">连接中</button></div>
    <nav class="views" id="nav"></nav>
    <div class="foot">本地自动保存；登录后同步到腾讯云。<br><button class="btn sm ghost" id="cloudAccount" type="button">云端账户</button></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="cloud-gate" id="cloudGate" hidden>
  <form class="cloud-login" id="cloudLogin">
    <div class="moon" aria-hidden="true">☾</div>
    <h2>紫月的求职工作台</h2>
    <p class="lead">登录后，手机和电脑会使用同一份投递记录。</p>
    <div class="stack">
      <label>用户名<input id="cloudUsername" value="ZIYUE" autocomplete="username" autocapitalize="characters"></label>
      <label>密码<input id="cloudPassword" type="password" autocomplete="current-password" required></label>
      <div class="cloud-error" id="cloudError" role="alert"></div>
      <button class="btn" id="cloudLoginBtn" type="submit">登录并同步</button>
      <button class="btn ghost" id="offlineBtn" type="button">暂时离线使用</button>
      <div class="small muted">密码只交给腾讯云身份认证，本页面不会保存密码。</div>
    </div>
  </form>
</div>

<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
<script>
(function(){
"use strict";
/* ================= state ================= */
const KEY="qz.v1";
const SYNC_KEY="qz.v1.sync";
const CLOUD_ENV="subjective-snake-d9ecykide3a2c97";
const STAGES=["待投","已投","笔试","面试","Offer","结束"];
const CATS=["AI教育","教师","机构"];
const VIEWS=[["overview","概览"],["me","认识我"],["fit","岗位分析"],["jd","JD 拆解器"],["cv","简历定制"],["board","投递看板"],["practice","面试陪练"]];
const blank=()=>({profile:{text:"",name:"",email:"",phone:"",edu:[],exp:[],skills:[],strengths:[]},jobs:[],jds:[],versions:[],practice:{},ammo:[],seedVersion:""});
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)return Object.assign(blank(),s)}catch(e){}return blank()}
let saveT=null;
let cloudSaveT=null,cloudReady=false,cloudBusy=false,cloudUserId="",lastCloudStamp=0,app=null,auth=null,rdb=null;
function localStamp(){return +(localStorage.getItem(SYNC_KEY)||0)}
function saveLocal(mark=true){try{localStorage.setItem(KEY,JSON.stringify(S));if(mark)localStorage.setItem(SYNC_KEY,String(Date.now()))}catch(e){toast("保存失败：浏览器存储不可用")}}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{saveLocal(true);queueCloudSave()},120)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("已复制")}catch(e){toast("复制失败，请长按手动复制")}}

/* ================= CloudBase sync ================= */
function setSync(label,state=""){
  const p=$("#syncStatus");if(p){p.textContent=label;p.dataset.state=state}
  const a=$("#cloudAccount");if(a)a.textContent=cloudReady?"退出云端":"云端账户";
}
function cloudMessage(error){
  const raw=String(error?.message||error?.error_description||error||"");
  if(/password|credential|用户名|密码|账号/i.test(raw))return "用户名或密码不正确，请再试一次。";
  if(/domain|cors|origin|域名/i.test(raw))return "当前网址还没有加入腾讯云安全域名。";
  if(/network|fetch|timeout|网络/i.test(raw))return "暂时连不上腾讯云，请检查网络后重试。";
  return raw||"连接失败，请稍后重试。";
}
function showCloudGate(message=""){
  $("#cloudError").textContent=message;
  $("#cloudGate").hidden=false;
  setTimeout(()=>$("#cloudPassword").focus(),50);
}
function hideCloudGate(){ $("#cloudGate").hidden=true;$("#cloudPassword").value="";$("#cloudError").textContent="" }
function rowsOf(result){
  const d=result?.data;
  if(Array.isArray(d))return d;
  if(Array.isArray(d?.data))return d.data;
  return d&&typeof d==="object"?[d]:[];
}
async function fetchCloudRow(){
  const result=await rdb.from("job_workspace").select("*").limit(1);
  if(result?.error)throw result.error;
  return rowsOf(result)[0]||null;
}
function applyCloudRow(row){
  if(!row?.state)return;
  S=Object.assign(blank(),typeof row.state==="string"?JSON.parse(row.state):row.state);
  const stamp=Date.parse(row.updated_at)||Date.now();
  lastCloudStamp=stamp;
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(SYNC_KEY,String(stamp))}catch(e){}
  render();
}
function queueCloudSave(){
  if(!cloudReady)return;
  clearTimeout(cloudSaveT);
  cloudSaveT=setTimeout(()=>saveCloud(),650);
}
async function saveCloud(){
  if(!cloudReady||cloudBusy)return;
  cloudBusy=true;setSync("同步中","busy");
  const stamp=new Date().toISOString();
  try{
    let result;
    if(cloudUserId){
      result=await rdb.from("job_workspace").upsert({user_id:cloudUserId,state:S,updated_at:stamp},{onConflict:"user_id"});
    }else{
      result=await rdb.from("job_workspace").insert({state:S,updated_at:stamp});
    }
    if(result?.error)throw result.error;
    const row=await fetchCloudRow();
    if(row){cloudUserId=row.user_id;lastCloudStamp=Date.parse(row.updated_at)||Date.now()}
    try{localStorage.setItem(SYNC_KEY,String(lastCloudStamp))}catch(e){}
    setSync("已同步","ok");
  }catch(error){
    console.error("CloudBase save failed",error);
    setSync("同步失败","error");
  }finally{cloudBusy=false}
}
async function pullCloud(announce=false,initial=false){
  if(!cloudReady||cloudBusy)return;
  cloudBusy=true;if(announce)setSync("检查中","busy");
  try{
    let row=await fetchCloudRow();
    if(!row){
      cloudBusy=false;
      await saveCloud();
      if(announce)toast("本机数据已上传腾讯云");
      return;
    }
    cloudUserId=row.user_id;
    const remoteStamp=Date.parse(row.updated_at)||0;
    if(initial&&localStamp()>remoteStamp){
      cloudBusy=false;
      await saveCloud();
      return;
    }
    if(initial||remoteStamp>lastCloudStamp){
      applyCloudRow(row);
      if(announce)toast("已载入云端最新数据");
    }
    setSync("已同步","ok");
  }catch(error){
    console.error("CloudBase pull failed",error);
    setSync("同步失败","error");
    if(announce)toast(cloudMessage(error));
  }finally{cloudBusy=false}
}
async function connectCloud(){
  cloudReady=true;setSync("连接中","busy");
  await pullCloud(false,true);
}
async function initCloud(){
  if(!window.cloudbase){setSync("离线","error");return}
  try{
    app=cloudbase.init({env:CLOUD_ENV});
    auth=app.auth();
    rdb=app.rdb();
    const state=await auth.getLoginState();
    if(state)await connectCloud();
    else{setSync("未登录","");showCloudGate()}
  }catch(error){
    console.error("CloudBase init failed",error);
    setSync("连接失败","error");
    showCloudGate(cloudMessage(error));
  }
}
async function signOutCloud(){
  try{await auth.signOut()}catch(e){}
  cloudReady=false;cloudUserId="";lastCloudStamp=0;
  setSync("未登录","");
  showCloudGate();
}

/* ================= knowledge base ================= */

 "用户研究":["用户研究","user research","ux research","用研"],

 "R":["r语言"," r,","rstudio"],
 "Python":["python"],
 "SQL":["sql"],
 "Excel":["excel"],
 "Figma":["figma","axure","墨刀"],
 "原型":["原型","prototype","交互稿"],

 "PRD":["prd","产品文档","需求文档"],
 "竞品分析":["竞品","competitive"],
 "产品设计":["产品设计","产品方案","功能设计","product design"],
 "项目管理":["项目管理","推进","落地","project management","跨团队","协调"],
 "沟通":["沟通","communication","表达","协作"],
 "教学":["教学","授课","teaching","课堂","上课"],
 "课程设计":["课程设计","课程研发","curriculum","lesson plan","教案","备课"],
 "教研":["教研","教学研究","内容研发"],
 "英语教学":["英语教学","english teaching","esl","efl","英语老师","英语教师"],
 "CELTA":["celta"],
 "TESOL":["tesol","tefl","tkt"],
 "雅思托福":["雅思","托福","ielts","toefl"],
 "二语习得":["二语习得","second language","sla","语言习得","language acquisition"],
 "语言学":["语言学","linguistic","语音","speech"],

function norm(t){return " "+String(t||"").toLowerCase().replace(/\s+/g," ")+" "}
function findSkills(text){const t=norm(text);return Object.keys(SK).filter(k=>SK[k].some(a=>t.includes(a.toLowerCase())))}
function countSkill(text,k){const t=norm(text);return SK[k].reduce((n,a)=>{let i=0,c=0;const s=a.toLowerCase();while((i=t.indexOf(s,i))>-1){c++;i+=s.length}return n+c},0)}

function nextSteps(){

  const todo=S.jobs.filter(j=>j.stage==="待投");

  dued.slice(0,2).forEach(j=>{const d=daysLeft(j.due);out.push({t:`投 ${j.co}｜${j.role}`,d:d<0?`截止已过 ${-d} 天，先确认是否还开放`:`剩 ${d} 天`,go:"board"})});

async function syncSeed(manual){

    (d.ammo||[]).forEach(sa=>{if(!S.ammo.some(a=>a.id===sa.id)){S.ammo.push(Object.assign({},sa));add++}});

    render();

function parseResume(text){
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const email=(text.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[""])[0];
  const phone=(text.match(/(\+?86[\s-]?)?1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/)||[""])[0];
  const name=lines.find(l=>/^[一-龥]{2,4}$/.test(l)||/^[A-Z][a-z]+(\s[A-Z][a-z]+){1,2}$/.test(l))||"";
  const eduRe=/(大学|学院|University|College|硕士|本科|学士|MSc|BSc|\bBA\b|\bMA\b)/i;
  const edu=lines.filter(l=>eduRe.test(l)).slice(0,6);
  const exp=lines.filter(l=>!eduRe.test(l)&&/(20\d{2})\s*[.\-/年]/.test(l)).slice(0,10);
  return {name,email,phone,edu,exp,skills:findSkills(text)};
}

function analyzeJD(text){
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  let mode=null;const resp=[],reqs=[];
  lines.forEach(l=>{
    if(/(职责|工作内容|岗位描述|你将|responsibilit|what you.?ll do)/i.test(l)&&l.length<30){mode="r";return}
    if(/(要求|任职|资格|我们希望|加分|优先|requirement|qualification|what we.?re looking)/i.test(l)&&l.length<30){mode="q";return}
    const item=l.replace(/^[\d一二三四五六七八九十]+[.、)）]\s*|^[•·\-*]\s*/,"");
    if(mode==="r")resp.push(item);else if(mode==="q")reqs.push(item);
  });
  if(!resp.length&&!reqs.length)lines.forEach(l=>(/(优先|要求|具备|熟悉|以上|学历|专业)/.test(l)?reqs:resp).push(l));
  const mine=mySkills();
  const kws=Object.keys(SK).map(k=>({k,n:countSkill(text,k)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).map(x=>Object.assign(x,{hit:mine.has(x.k)}));
  const score=kws.length?Math.round(kws.filter(x=>x.hit).length/kws.length*100):0;
  return {resp,reqs,kws,score};
}

     <div class="small muted">已存版本 ${S.versions.length}</div>
     <div class="stack">${S.versions.map(v=>`<div class="row"><button class="btn sm ghost" data-ver="${v.id}" style="flex:1;text-align:left">${esc(v.title)}</button><button class="btn sm danger" data-vdel="${v.id}">删除</button></div>`).join("")}</div></div>
    <div class="card"><h2>${ver?esc(ver.title):"逐段改写"}</h2><div class="stack" id="paras">${src.map((p,i)=>{const h=hitsOf(p);return `<div class="para"><div class="meta"><span>段落 ${i+1}</span>${h.length?`<b>命中 ${h.length} 个关键词</b>`:"<span>未命中关键词</span>"}</div><textarea data-i="${i}">${esc(p)}</textarea></div>`}).join("")}</div>
     <div class="row"><button class="btn" id="vSave">保存版本</button><button class="btn ghost" id="vCopy">复制全文</button><button class="btn ghost" id="vTxt">导出 txt</button></div>
     <p class="small muted" style="margin:0">保存后固定留存，可随时载入继续改；导出的纯文本可以直接粘贴到招聘网站或邮件。</p></div>
   </div></div>`);
  const paras=()=>[...m.querySelectorAll("#paras textarea")].map(t=>t.value);
  $("#cvJd").onchange=e=>go("cv",e.target.value);
  $("#vSave").onclick=()=>{const title=`${jd.co} · ${jd.role} · ${today()}`;if(ver){ver.paras=paras();ver.title=title}else S.versions.unshift({id:uid(),jdId:jd.id,title,paras:paras(),created:today()});save();toast("版本已保存");render()};
  $("#vCopy").onclick=()=>copy(paras().join("\n\n"));

function splitParas(t){let ps=t.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);if(ps.length<4)ps=t.split(/\n/).map(s=>s.trim()).filter(Boolean);return ps}

       <div class="mv">${si>0?`<button data-b>← ${STAGES[si-1]}</button>`:""}${si<STAGES.length-1?`<button data-f style="border-color:var(--pine);font-weight:600">${STAGES[si+1]} →</button>`:""}</div>`;

      <div class="row"><button class="btn ghost" data-r="0" style="flex:1">说不出</button><button class="btn ghost" data-r="1" style="flex:1">说了一半</button><button class="btn" data-r="2" style="flex:1">能讲清</button></div></div></div>`;
    el.querySelector("#dq").onclick=end;
    const rv=el.querySelector("#rv");
    clearInterval(t);t=setInterval(()=>{secs--;el.querySelector("#tm").textContent=Math.max(secs,0);if(secs<=0){clearInterval(t);rv.disabled=false}},1000);
    el.querySelector("#da").oninput=e=>{if(e.target.value.trim().length>=15)rv.disabled=false};
    el.querySelector("#said").onclick=()=>{rv.disabled=false};
    rv.onclick=()=>{clearInterval(t);el.querySelector("#s2").hidden=false;el.querySelector("#s2").scrollIntoView({block:"start"})};
    el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const mine=el.querySelector("#da").value.trim();const real=S.ammo.find(x=>x.id===a.id);
      if(real){real.rating=+b.dataset.r;real.tries=(real.tries||0)+1;if(mine)real.mine=mine;save()}
      i++;if(i<deck.length)show();else{toast("练完了");end()}});
  };show();
}

/* ================= boot ================= */
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==view){view=v;viewArg=null;render()}});
$("#cloudLogin").addEventListener("submit",async e=>{
  e.preventDefault();
  const username=$("#cloudUsername").value.trim();
  const password=$("#cloudPassword").value;
  const btn=$("#cloudLoginBtn");
  if(!username||!password){$("#cloudError").textContent="请填写用户名和密码。";return}
  btn.disabled=true;btn.textContent="正在登录…";$("#cloudError").textContent="";
  try{
    if(!app){app=cloudbase.init({env:CLOUD_ENV});auth=app.auth();rdb=app.rdb()}
    await auth.signIn({username,password});
    hideCloudGate();
    await connectCloud();
    toast("登录成功，云端同步已开启");
  }catch(error){
    console.error("CloudBase sign in failed",error);
    $("#cloudError").textContent=cloudMessage(error);
  }finally{btn.disabled=false;btn.textContent="登录并同步"}
});
$("#offlineBtn").onclick=()=>{hideCloudGate();setSync("离线","");toast("当前使用本机数据")};
$("#syncStatus").onclick=()=>cloudReady?pullCloud(true):showCloudGate();
$("#cloudAccount").onclick=()=>cloudReady?signOutCloud():showCloudGate();
window.addEventListener("focus",()=>{if(cloudReady)pullCloud(false)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cloudReady)pullCloud(false)});
setInterval(()=>{if(cloudReady&&document.visibilityState==="visible")pullCloud(false)},12000);
render();
if(!S.seedVersion)syncSeed(false);
initCloud();
})();
</script>
</body>
</html>
